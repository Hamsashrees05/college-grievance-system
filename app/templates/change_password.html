{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="panel">
    <h1 class="h3">Change password</h1>
    <form method="post" novalidate>
      {{ csrf() }}
      <div class="mb-3"><label class="form-label" for="current">Current password</label>
        <input class="form-control" type="password" id="current" name="current" autocomplete="current-password" required></div>
      <div class="mb-3"><label class="form-label" for="new">New password</label>
        <input class="form-control" type="password" id="new" name="new" autocomplete="new-password" aria-describedby="h" required>
        <div id="h" class="form-text">At least 8 characters with an uppercase letter, a lowercase letter and a digit.</div></div>
      <div class="mb-3"><label class="form-label" for="new2">Repeat new password</label>
        <input class="form-control" type="password" id="new2" name="new2" autocomplete="new-password" required></div>
      <button class="btn btn-primary" type="submit">Save new password</button>
    </form>
  </div>
</div></div>
{% endblock %}
