{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="panel">
    <h1 class="h3">Log in</h1>
    <form method="post" novalidate>
      {{ csrf() }}
      <div class="mb-3"><label class="form-label" for="email">College e-mail</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 mb-0 small">No account yet? <a href="{{ url_for('auth.register') }}">Create one</a>.</p>
  </div>
</div></div>
{% endblock %}
